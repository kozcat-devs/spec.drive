    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | specdrive</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { c1: '#0A0A0A', c2: '#121212', r1: '#C1121F', r2: '#D90429', r3: '#EF233C' },
                fontFamily: { logo: ['Bebas Neue','sans-serif'], heading: ['Oswald','sans-serif'], body: ['Inter','sans-serif'] }
            } }
        }

<body data-root="" class="bg-c1 text-white min-h-screen flex flex-col justify-between font-body selection:bg-r2 selection:text-white">

    <header id="sd-header" class="w-full bg-c2/90 border-b border-[#1A1A1A] sticky top-0 z-50"></header>

    <main class="flex-grow relative page-fade-in">
        <div class="min-h-[calc(100vh-160px)] p-4 md:p-8 max-w-6xl mx-auto my-6">
            <h2 class="font-heading font-bold text-3xl md:text-5xl text-white uppercase tracking-wide mb-2 reveal" data-i18n="libraryTitle"></h2>
            <p class="text-gray-400 font-body mb-6 reveal reveal-delay-1" data-i18n="librarySubtitle"></p>

            <!-- Country filter chips -->
            <div id="countryChips" class="flex flex-wrap gap-2 mb-8 reveal reveal-delay-2"></div>

            <div class="livery-stripe mb-8"></div>

            <div id="brandGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>
    </main>

    <button id="backToTop" aria-label="Back to top" class="fixed bottom-6 right-6 z-40 w-11 h-11 rounded-full bg-r1 hover:bg-r2 text-white flex items-center justify-center shadow-xl">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <footer id="sd-footer" class="bg-c2 border-t border-[#1A1A1A] py-6 text-center text-xs text-gray-500 font-body"></footer>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/library.js"></script>
    <script>SD.init('library');</script>
